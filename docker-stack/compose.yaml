services:

  database:
    image: mysql:8.4
    container_name: cadastro-database

    ports:
      - "3307:3306"

    environment:
    
      MYSQL_ROOT_PASSWORD: felipe87
      MYSQL_DATABASE: cadastro_de_produtos

    volumes:
     - cadastro-database-data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-pfelipe87"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: 
      context: ../cadastro_de_produtos
      dockerfile: Dockerfile

    container_name: cadastro-backend

    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://database/cadastro_de_produtos
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: felipe87
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3002,http://localhost:5175,http://localhost:4175

    ports:
     - "8084:8084"

    depends_on:
      database:
        condition: service_healthy


  frontend:
    build: 
      context: ../cadastro_de_produtos_frontend
      dockerfile: Dockerfile

    container_name: cadastro-frontend

    volumes:
    - ../cadastro_de_produtos_frontend:/app
    - /app/node_modules

    ports:
     - "3002:3002"

    environment:
      CHOKIDAR_USEPOLLING: "true" 
  

    depends_on:
     - backend

volumes:
    cadastro-database-data: 
